<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIP-STAR &bull; Create Account</title>
  <meta name="description" content="Create a TripStar account to unlock personalized global travel, exclusive stays, and ambassador benefits.">
  <link rel="stylesheet" href="css/apple-design.css">
</head>
<body>

  <!-- Registration Card (Navbar removed, back icon inside form) -->
  <main class="apple-auth-wrapper">
    <div class="apple-auth-card" style="max-width:480px;">
      <!-- Back Icon Button inside the form -->
      <div style="text-align: left; margin-bottom: 14px;">
        <a href="index.html" class="auth-back-btn" aria-label="Return to Home">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          Return Home
        </a>
      </div>

      <div class="auth-icon-badge">
        <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>

      <h1 style="font-size:1.65rem; font-weight:700; color:var(--label-primary); letter-spacing:-0.02em; margin-bottom:6px;">
        Join the <span class="font-cursive" style="font-size:1.4em; color:var(--gold-warm); font-weight:normal; vertical-align:middle;">TripStar</span> Collective
      </h1>
      <p style="font-size:0.9rem; color:var(--label-secondary); margin-bottom:22px; line-height:1.5;">
        Unlock private stays, bespoke itineraries, and community travel privileges.
      </p>

      <!-- Pending Reservation / Active Session Banner -->
      <div id="signUpPendingBanner" style="display:none; margin-bottom:18px; padding:12px 16px; border-radius:12px; background:rgba(0,113,227,0.06); border:1px solid rgba(0,113,227,0.2); color:#0071E3; font-size:0.88rem; text-align:left;"></div>

      <!-- Feedback / Error Notice -->
      <div id="signUpAlert" class="auth-alert-message error" style="display:none;"></div>

      <form id="signUpForm" onsubmit="event.preventDefault(); handleSignUp();">
        <div class="apple-form-group">
          <label class="apple-form-label" for="regFullName">Full Name</label>
          <div class="apple-input-wrapper">
            <input type="text" id="regFullName" class="apple-form-input" placeholder="e.g. Liam Walker" required autocomplete="name">
          </div>
        </div>

        <div class="apple-form-group">
          <label class="apple-form-label" for="regEmail">Email Address</label>
          <div class="apple-input-wrapper">
            <input type="email" id="regEmail" class="apple-form-input" placeholder="liam@example.com" required autocomplete="email">
          </div>
        </div>

        <div class="apple-form-group">
          <label class="apple-form-label" for="regCountry">Country / Region</label>
          <select id="regCountry" class="apple-form-select" style="background:#F5F5F7;">
            <option value="United States">United States</option>
            <option value="Switzerland">Switzerland</option>
            <option value="United Kingdom">United Kingdom</option>
            <option value="France">France</option>
            <option value="Italy">Italy</option>
            <option value="Japan">Japan</option>
            <option value="Australia">Australia</option>
            <option value="India">India</option>
            <option value="Germany">Germany</option>
            <option value="Singapore">Singapore</option>
            <option value="Canada">Canada</option>
          </select>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="apple-form-group">
            <label class="apple-form-label" for="regPassword">Password</label>
            <div class="apple-input-wrapper">
              <input type="password" id="regPassword" class="apple-form-input" placeholder="Min 6 chars" required autocomplete="new-password">
            </div>
          </div>

          <div class="apple-form-group">
            <label class="apple-form-label" for="regConfirmPassword">Confirm</label>
            <div class="apple-input-wrapper">
              <input type="password" id="regConfirmPassword" class="apple-form-input" placeholder="Re-enter" required autocomplete="new-password">
            </div>
          </div>
        </div>

        <div style="margin:12px 0 20px;">
          <label style="display:flex; align-items:flex-start; gap:8px; font-size:0.83rem; color:var(--label-secondary); cursor:pointer; text-align:left;">
            <input type="checkbox" id="termsCheck" required style="accent-color:var(--apple-blue); margin-top:2px;">
            <span>I agree to TripStar's Terms of Service and Privacy Policy.</span>
          </label>
        </div>

        <button type="submit" id="submitSignUpBtn" class="btn-apple btn-apple-primary btn-apple-lg" style="width:100%; margin-bottom:18px;">
          Create My Account
        </button>

        <div style="font-size:0.88rem; color:var(--label-secondary); border-top:1px solid #E5E5EA; padding-top:16px;">
          Already have an account? 
          <a href="signin.html" style="color:var(--apple-blue); font-weight:700; text-decoration:none;">Sign in &rarr;</a>
        </div>
      </form>
    </div>
  </main>

  <script src="js/ai-engine.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pendingRaw = sessionStorage.getItem('tripstar_pending_booking');
      const banner = document.getElementById('signUpPendingBanner');
      if (pendingRaw && banner) {
        try {
          const pending = JSON.parse(pendingRaw);
          banner.style.display = 'block';
          banner.innerHTML = `
            <strong>Reserving ${pending.title}</strong> (${pending.total})<br>
            <span style="font-size:0.82rem; color:var(--label-secondary);">Create your account to confirm and secure your reservation immediately.</span>
          `;
        } catch(e) {}
      }
    });

    function handleSignUp() {
      const fullName = document.getElementById('regFullName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const country = document.getElementById('regCountry').value;
      const pwd = document.getElementById('regPassword').value;
      const confirmPwd = document.getElementById('regConfirmPassword').value;
      const alertBox = document.getElementById('signUpAlert');
      const submitBtn = document.getElementById('submitSignUpBtn');

      alertBox.style.display = 'none';

      if (pwd.length < 6) {
        alertBox.className = 'auth-alert-message error';
        alertBox.innerHTML = 'Password must be at least 6 characters.';
        alertBox.style.display = 'block';
        return;
      }

      if (pwd !== confirmPwd) {
        alertBox.className = 'auth-alert-message error';
        alertBox.innerHTML = 'Passwords do not match. Please verify.';
        alertBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Creating Account...';

      setTimeout(() => {
        const result = TripStar.registerAccount(fullName, email, pwd, country);
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Create My Account';

        if (!result.success) {
          alertBox.className = 'auth-alert-message error';
          alertBox.innerHTML = result.message;
          alertBox.style.display = 'block';
          return;
        }

        const pendingRaw = sessionStorage.getItem('tripstar_pending_booking');
        if (pendingRaw) {
          try {
            const pending = JSON.parse(pendingRaw);
            const bookings = TripStar.getStorage(TripStar.STORAGE_KEYS.BOOKINGS, []);
            const newBooking = {
              id: 'TS-' + Math.floor(100000 + Math.random() * 900000),
              title: pending.title,
              location: pending.location,
              checkIn: pending.checkIn,
              checkOut: pending.checkOut,
              guests: pending.guests || 2,
              total: pending.total,
              userEmail: result.user.email,
              userName: result.user.name,
              date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })
            };
            bookings.push(newBooking);
            TripStar.setStorage(TripStar.STORAGE_KEYS.BOOKINGS, bookings);
            sessionStorage.removeItem('tripstar_pending_booking');
            TripStar.showToast(`Welcome to TripStar, ${result.user.name}! Your reservation at ${pending.title} is confirmed!`, "success");
            setTimeout(() => {
              window.location.href = pending.returnUrl || 'listing.html';
            }, 850);
            return;
          } catch(e) {}
        }

        TripStar.showToast(`Welcome to TripStar, ${result.user.name.split(' ')[0]}!`, "success");
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 700);
      }, 350);
    }
  </script>
</body>
</html>
